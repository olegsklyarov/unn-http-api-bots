<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="836" viewBox="0 0 900 836" role="img" aria-label="Сверху классический паттерн, где каждый handler хранит ссылку на следующего. Снизу наш код, где список handlers хранит и обходит Dispatcher" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.panel{fill:#EDF1EE;stroke:#BFCAC4;stroke-width:1}
.box{fill:#FFFFFF;stroke:#BFCAC4;stroke-width:1.5}
.box.acc-b{stroke:#C2411A;stroke-width:2}
.abs{fill:#E4EAF1;stroke:#BFCAC4;stroke-width:1.5}
.ext{fill:#EFEFE6;stroke:#BFCAC4;stroke-width:1.5}
.go{fill:#D9EFE9;stroke:#1B7A68;stroke-width:1.5}
.stop{fill:#FBE5DC;stroke:#C2411A;stroke-width:1.5}
.warn{fill:#FFFFFF;stroke:#BFCAC4;stroke-width:1.5}
.none{fill:none;stroke:#BFCAC4;stroke-width:1.5;stroke-dasharray:5 4}
.dash{stroke-dasharray:5 4}
.ln{stroke:#57665F;stroke-width:1.5;fill:none}
.ln.acc{stroke:#C2411A;stroke-width:2}
.mk{fill:#57665F}
.mk-tri{fill:#FFFFFF;stroke:#57665F;stroke-width:1}
text{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}
.t{fill:#18221E;font-size:13.5px;font-weight:500}
.t.m,.m{font-family:'IBM Plex Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:12.5px;font-weight:400}
.t.hd{font-weight:600;font-size:14px}
.t.m.hd{font-weight:500;font-size:13px}
.sm{fill:#57665F;font-size:12px;font-weight:400}
.sm2{font-size:12px}
.acc-t{fill:#C2411A;font-size:13px;font-weight:600}
</style><rect width="900" height="836" fill="#F5F7F4"/><defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="tri3" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" class="mk-tri"/></marker></defs><text x="14" y="30" class="t hd" text-anchor="start">GoF: Chain of Responsibility</text><rect x="12" y="40" width="876" height="340" rx="5" class="panel"/><rect x="28" y="70" width="120" height="55" rx="5" class="box"/><text x="88.0" y="90" class="t hd m" text-anchor="middle">Client</text><line x1="28" x2="148" y1="100" y2="100" class="ln"/><text x="38" y="117" class="t m sm2" text-anchor="start">handler: Handler</text><rect x="200" y="70" width="190" height="88" rx="5" class="abs"/><text x="295.0" y="86" class="sm" text-anchor="middle">«abstract»</text><text x="295.0" y="104" class="t hd m" text-anchor="middle">Handler</text><line x1="200" x2="390" y1="114" y2="114" class="ln"/><text x="210" y="131" class="t m sm2" text-anchor="start">next: Handler</text><text x="210" y="150" class="t m sm2" text-anchor="start">handle(request)</text><polyline points="148,100 198,100" class="ln" marker-end="url(#ah3)"/><text x="173" y="92" class="sm" text-anchor="middle">первый</text><polyline points="390,118 412,118 412,168 300,168 300,160" class="ln acc" marker-end="url(#ah3)"/><text x="418" y="146" class="acc-t m" text-anchor="start">next</text><rect x="36" y="250" width="150" height="55" rx="5" class="box"/><text x="111.0" y="270" class="t hd m" text-anchor="middle">ConcreteHandlerA</text><line x1="36" x2="186" y1="280" y2="280" class="ln"/><text x="46" y="297" class="t m sm2" text-anchor="start">handle(request)</text><rect x="226" y="250" width="150" height="55" rx="5" class="box"/><text x="301.0" y="270" class="t hd m" text-anchor="middle">ConcreteHandlerB</text><line x1="226" x2="376" y1="280" y2="280" class="ln"/><text x="236" y="297" class="t m sm2" text-anchor="start">handle(request)</text><polyline points="111,250 111,215 260,215 260,158" class="ln" marker-end="url(#tri3)"/><polyline points="301,250 301,215 260,215" class="ln"/><text x="500" y="110" class="sm" text-anchor="start">Каждый handler сам решает: обработать</text><text x="500" y="128" class="sm" text-anchor="start">или передать дальше через next.handle().</text><text x="500" y="156" class="acc-t" text-anchor="start">Ссылка на следующего хранится в Handler.</text><text x="14" y="410" class="t hd" text-anchor="start">Наш код</text><rect x="12" y="420" width="876" height="404" rx="5" class="panel"/><g transform="translate(0,380)"><rect x="28" y="70" width="130" height="55" rx="5" class="box"/><text x="93.0" y="90" class="t hd m" text-anchor="middle">long_polling</text><line x1="28" x2="158" y1="100" y2="100" class="ln"/><text x="38" y="117" class="t m sm2" text-anchor="start">dispatch(update)</text><rect x="200" y="70" width="232" height="93" rx="5" class="box acc-b"/><text x="316.0" y="90" class="t hd m" text-anchor="middle">Dispatcher</text><line x1="200" x2="432" y1="100" y2="100" class="ln"/><text x="210" y="117" class="t m sm2" text-anchor="start">_handlers: list[Handler]</text><text x="210" y="136" class="t m sm2" text-anchor="start">add_handlers(*handlers)</text><text x="210" y="155" class="t m sm2" text-anchor="start">dispatch(update)</text><polyline points="158,100 198,100" class="ln" marker-end="url(#ah3)"/><rect x="200" y="205" width="232" height="88" rx="5" class="abs"/><text x="316.0" y="221" class="sm" text-anchor="middle">«abstract»</text><text x="316.0" y="239" class="t hd m" text-anchor="middle">Handler</text><line x1="200" x2="432" y1="249" y2="249" class="ln"/><text x="210" y="266" class="t m sm2" text-anchor="start">can_handle(update) → bool</text><text x="210" y="285" class="t m sm2" text-anchor="start">handle(update) → Status</text><polyline points="316,163 316,203" class="ln" marker-end="url(#ah3)"/><text x="324" y="183" class="sm" text-anchor="start">знает только Handler</text><rect x="28" y="332" width="404" height="56" rx="5" class="box"/><text x="230.0" y="349.5" class="t m" text-anchor="middle">PersistUpdate, PersistUser,</text><text x="230.0" y="364.5" class="t m" text-anchor="middle">CallbackRawJson, CallbackHide, MessageEchoText,</text><text x="230.0" y="379.5" class="t m" text-anchor="middle">MessageEchoSticker, MessageEchoVideoNote</text><polyline points="260,332 260,295" class="ln" marker-end="url(#tri3)"/></g><text x="500" y="490" class="sm" text-anchor="start">handle() вернул STOP: Dispatcher прерывает цикл.</text><text x="500" y="518" class="acc-t" text-anchor="start">Список следующих хранится в Dispatcher.</text></svg>