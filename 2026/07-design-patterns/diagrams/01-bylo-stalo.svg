</style><rect width="900" height="710" fill="#F5F7F4"/><defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="tri1" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" class="mk-tri"/></marker></defs><text x="14" y="30" class="t hd" text-anchor="start">БЫЛО: всё в __main__.py</text><rect x="12" y="40" width="876" height="292" rx="5" class="panel"/><rect x="28" y="54" width="560" height="32" rx="5" class="box"/><text x="308.0" y="74.5" class="t m" text-anchor="middle">while True: getUpdates(offset)</text><rect x="28" y="92" width="560" height="32" rx="5" class="box"/><text x="308.0" y="112.5" class="t m" text-anchor="middle">persist_update(update)</text><rect x="28" y="130" width="560" height="32" rx="5" class="box"/><text x="308.0" y="150.5" class="t m" text-anchor="middle">persist_user(update)</text><rect x="28" y="168" width="560" height="32" rx="5" class="box"/><text x="308.0" y="188.5" class="t m" text-anchor="middle">if &#x27;text&#x27; in message: sendMessage</text><rect x="28" y="206" width="560" height="32" rx="5" class="box"/><text x="308.0" y="226.5" class="t m" text-anchor="middle">elif &#x27;sticker&#x27; in message: sendSticker</text><rect x="28" y="244" width="560" height="32" rx="5" class="box"/><text x="308.0" y="264.5" class="t m" text-anchor="middle">elif &#x27;video_note&#x27; in message: sendVideoNote</text><rect x="28" y="282" width="560" height="32" rx="5" class="box"/><text x="308.0" y="302.5" class="t m" text-anchor="middle">elif callback_query: raw / hide</text><text x="612" y="120" class="sm" text-anchor="start">один цикл, одно место для правок:</text><text x="612" y="138" class="sm" text-anchor="start">новый тип сообщения = ещё один elif</text><text x="14" y="364" class="t hd" text-anchor="start">СТАЛО: Dispatcher и handlers</text><rect x="12" y="374" width="876" height="322" rx="5" class="panel"/><rect x="28" y="392" width="170" height="36" rx="5" class="box"/><text x="113.0" y="414.5" class="t m" text-anchor="middle">__main__</text><rect x="28" y="472" width="170" height="36" rx="5" class="box"/><text x="113.0" y="494.5" class="t m" text-anchor="middle">long_polling</text><rect x="28" y="552" width="170" height="36" rx="5" class="abs"/><text x="113.0" y="574.5" class="t m hd" text-anchor="middle">Dispatcher</text><polyline points="113,428 113,470" class="ln" marker-end="url(#ah1)"/><polyline points="113,508 113,550" class="ln" marker-end="url(#ah1)"/><text x="121" y="454" class="sm" text-anchor="start">start_long_polling</text><text x="121" y="534" class="sm" text-anchor="start">dispatch(update)</text><text x="28" y="616" class="sm" text-anchor="start">в __main__ три строки:</text><text x="28" y="632" class="sm" text-anchor="start">собрать, зарегистрировать, запустить</text><polyline points="200,570 300,570 300,570" class="ln"/><line x1="300" x2="300" y1="406" y2="634" class="ln"/><polyline points="200,570 298,570" class="ln" marker-end="url(#ah1)"/><rect x="330" y="390" width="320" height="32" rx="5" class="go"/><text x="490.0" y="410.5" class="t m" text-anchor="middle">PersistUpdate</text><line x1="300" x2="330" y1="406" y2="406" class="ln"/><rect x="330" y="428" width="320" height="32" rx="5" class="go"/><text x="490.0" y="448.5" class="t m" text-anchor="middle">PersistUser</text><line x1="300" x2="330" y1="444" y2="444" class="ln"/><rect x="330" y="466" width="320" height="32" rx="5" class="stop"/><text x="490.0" y="486.5" class="t m" text-anchor="middle">CallbackRawJson</text><line x1="300" x2="330" y1="482" y2="482" class="ln"/><rect x="330" y="504" width="320" height="32" rx="5" class="stop"/><text x="490.0" y="524.5" class="t m" text-anchor="middle">CallbackHide</text><line x1="300" x2="330" y1="520" y2="520" class="ln"/><rect x="330" y="542" width="320" height="32" rx="5" class="stop"/><text x="490.0" y="562.5" class="t m" text-anchor="middle">MessageEchoText</text><line x1="300" x2="330" y1="558" y2="558" class="ln"/><rect x="330" y="580" width="320" height="32" rx="5" class="stop"/><text x="490.0" y="600.5" class="t m" text-anchor="middle">MessageEchoSticker</text><line x1="300" x2="330" y1="596" y2="596" class="ln"/><rect x="330" y="618" width="320" height="32" rx="5" class="stop"/><text x="490.0" y="638.5" class="t m" text-anchor="middle">MessageEchoVideoNote</text><line x1="300" x2="330" y1="634" y2="634" class="ln"/><rect x="680" y="396" width="12" height="12" rx="2" class="go"/><text x="700" y="407" class="sm" text-anchor="start">CONTINUE</text><text x="680" y="428" class="sm" text-anchor="start">записал данные, идём дальше</text><rect x="680" y="456" width="12" height="12" rx="2" class="stop"/><text x="700" y="467" class="sm" text-anchor="start">STOP</text><text x="680" y="488" class="sm" text-anchor="start">ответил, обход прервался</text></svg>