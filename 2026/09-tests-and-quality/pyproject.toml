[project]
name = "tests-and-quality"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "mypy",
]

[tool.ruff.lint.per-file-ignores]
# Учебный Mock в tests/mock.py, не unittest.mock.
"tests/**" = ["UP026"]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
packages = ["bot"]
